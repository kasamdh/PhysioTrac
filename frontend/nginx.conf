server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing: any path that isn't a real static file falls
    # through to index.html so React Router (not nginx) decides what to
    # render -- otherwise a hard refresh on e.g. /patients 404s.
    location / {
        try_files $uri /index.html;
    }
}
